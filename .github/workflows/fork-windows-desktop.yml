# Fork-only: release.yml runs only in pingdotgg/t3code on Blacksmith runners, so this
# builds the fork's release artifacts on GitHub-hosted runners: the unsigned Windows
# installer, Linux x64/arm64 AppImage/deb desktop packages and CLI archives. scripts/fork-release.sh dispatches it
# and publishes the draft after all assets are verified. The file keeps its old name because workflow_dispatch
# only reaches files already on the default branch.
# Like release-desktop.yml the Windows installer cross-builds on Linux; native Windows
# hosts install extra optional natives and fail the packaged payload file limit.
# node-pty compiles from source on Linux, so each CLI archive builds on its own arch.
#
#   gh workflow run fork-windows-desktop.yml --ref main -f version=<x.y.z-cn.N>
name: Fork release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Chinese release version (x.y.z-cn.N)."
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    needs: [cli_linux]
    name: Build Windows x64 installer
    if: github.repository == 'deepfry666/t3code-cn'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: false

      # The JS build compiles the Linux browser import helper, as release.yml's build_bundle does.
      - name: Install libsecret headers
        run: scripts/fork-apt-install.sh libsecret-1-dev pkg-config

      - name: Install
        run: vp install

      # Same public sign-in and relay ids that official preview builds take from .env.example.
      - name: Load public T3 Code config
        run: grep -E '^T3CODE_(CLERK_PUBLISHABLE_KEY|CLERK_JWT_TEMPLATE|CLERK_CLI_OAUTH_CLIENT_ID|RELAY_URL)=' .env.example >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@0.23.1

      - name: Build resource monitor
        run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      # GitHub release downloads of Electron and electron-builder-binaries returned 504s on
      # 2026-11-08. Builder tools are sha256-pinned; Electron is checked against the mirror's SHASUMS.
      - name: Download same-run Linux x64 runtime
        uses: actions/download-artifact@v8
        with:
          name: t3code-cn-cli-linux-x64
          path: wsl-runtime

      - name: Build installer
        env:
          BUILD_VERSION: ${{ inputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: deepfry666/t3code-cn
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_CUSTOM_DIR: "{{ version }}"
        run: |
          scripts/fork-validate-version.sh "$BUILD_VERSION"
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version "$BUILD_VERSION" --wsl-runtime "wsl-runtime/t3-$BUILD_VERSION-linux-x64.tar.gz" --verbose
          test -f release/latest.yml
          test -f "release/T3-Code-${BUILD_VERSION}-x64.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: t3code-cn-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  cli_linux:
    name: Build Linux ${{ matrix.arch }} desktop and CLI
    if: github.repository == 'deepfry666/t3code-cn'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    env:
      BUILD_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: false

      - name: Validate release version
        run: |
          scripts/fork-validate-version.sh "$BUILD_VERSION"

      - name: Install native build dependencies
        run: scripts/fork-apt-install.sh libsecret-1-dev pkg-config patchelf libatomic1 build-essential python3

      - name: Install
        run: vp install

      - name: Load public T3 Code config
        run: grep -E '^T3CODE_(CLERK_PUBLISHABLE_KEY|CLERK_JWT_TEMPLATE|CLERK_CLI_OAUTH_CLIENT_ID|RELAY_URL)=' .env.example >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Align package versions and build bundle
        run: |
          node scripts/update-release-package-versions.ts "$BUILD_VERSION"
          vp run build:desktop

      - name: Build and stage resource monitor
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          ARCH: ${{ matrix.arch }}
        run: |
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "$RUST_TARGET"
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-$ARCH"
          cp "native/resource-monitor/target/$RUST_TARGET/release/t3-resource-monitor" "$RUNNER_TEMP/cli-resource-monitor/linux-$ARCH/"

      - name: Build CLI executable and archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          node apps/server/scripts/cli.ts build-exe
          node scripts/build-cli-archive.ts --platform linux --arch "$ARCH" --version "$BUILD_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli

      - name: Smoke-test CLI archive
        env:
          ARCH: ${{ matrix.arch }}
        run: node scripts/smoke-cli-archive.ts --archive "release-cli/t3-$BUILD_VERSION-linux-$ARCH.tar.gz" --expect-version "$BUILD_VERSION"

      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: t3code-cn-cli-linux-${{ matrix.arch }}
          path: release-cli/t3-${{ inputs.version }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Install Linux desktop build libraries
        run: scripts/fork-apt-install.sh libgtk-3-0t64 libnss3 libasound2t64 libgbm1 imagemagick xvfb

      - name: Build Linux desktop and capture helpers
        env:
          ARCH: ${{ matrix.arch }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: deepfry666/t3code-cn
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_CUSTOM_DIR: "{{ version }}"
        run: |
          node scripts/build-desktop-artifact.ts --platform linux --target AppImage --arch "$ARCH" --build-version "$BUILD_VERSION" --skip-build --verbose
          test -s "release/T3-Code-$BUILD_VERSION-$ARCH.AppImage"
          test -s "release/T3-Code-$BUILD_VERSION-$ARCH.deb"
          manifest=latest-linux.yml
          if [[ "$ARCH" == arm64 ]]; then manifest=latest-linux-arm64.yml; fi
          grep -qx "version: $BUILD_VERSION" "release/$manifest"

      - name: Launch packaged AppImage
        if: matrix.arch == 'x64'
        run: |
          appimage="$GITHUB_WORKSPACE/release/T3-Code-$BUILD_VERSION-x64.AppImage"
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
          xvfb-run -a node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/desktop-launch-check" --executable "$RUNNER_TEMP/squashfs-root/t3code"

      - name: Upload launch check output
        if: failure() && matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-launch-check-linux-x64
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore

      - name: Upload Linux desktop
        uses: actions/upload-artifact@v7
        with:
          name: t3code-cn-desktop-linux-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux*.yml
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  upload_release:
    name: Upload CI files to existing draft
    needs: [build, cli_linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: t3code-cn-*
          merge-multiple: true
          path: release-upload
      - name: Upload without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(gh release view "v$BUILD_VERSION" --json isDraft --jq .isDraft)" = true
          cd release-upload
          sha256sum * > SHA256SUMS-ci
          gh release upload "v$BUILD_VERSION" ./* --clobber

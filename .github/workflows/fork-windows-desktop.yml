# Fork-only: release.yml runs only in pingdotgg/t3code on Blacksmith runners, so this
# builds an unsigned Windows installer on a GitHub-hosted runner for manual testing.
#
#   gh workflow run fork-windows-desktop.yml --ref main
name: Fork Windows desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 installer
    if: github.repository == 'deepfry666/t3code-cn'
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install
        run: vp install

      # Same public sign-in and relay ids that official preview builds take from .env.example.
      - name: Load public T3 Code config
        shell: bash
        run: grep -E '^T3CODE_(CLERK_PUBLISHABLE_KEY|CLERK_JWT_TEMPLATE|CLERK_CLI_OAUTH_CLIENT_ID|RELAY_URL)=' .env.example >> "$GITHUB_ENV"

      # GitHub release downloads of electron-builder-binaries returned 504s on 2026-11-08;
      # electron-builder pins each tool's sha256, so a mirror cannot swap the files.
      - name: Build installer
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --verbose

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: t3code-cn-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

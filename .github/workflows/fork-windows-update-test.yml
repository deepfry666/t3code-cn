# Fork-only: install a Chinese Windows baseline build on a clean Windows runner, then
# drive its real updater against a mock feed carrying a newer Actions artifact. Covers
# discovery, download, the in-app install, the installer's restart, the new version and
# the seeded state the user still sees. It publishes nothing.
#
#   gh workflow run fork-windows-update-test.yml -f baseline_run_id=<run> -f baseline_version=0.1.7-cn.2 -f run_id=<run> -f new_version=0.1.7-cn.3
#
# The new artifact must be a higher Chinese version than the baseline (fork-windows-desktop.yml
# uploads whatever version the build was given), and must contain its `latest.yml` and
# `T3-Code-<version>-x64.exe` together.
name: Fork Windows update test

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the workflow_dispatch build that produced the new installer artifact."
        type: string
        required: true
      baseline_run_id:
        description: "Run id of the baseline installer build."
        type: string
        required: true
      new_version:
        description: "Candidate version, e.g. 0.1.7-cn.3; must be greater than baseline_version."
        type: string
        required: true
      artifact_name:
        description: "Artifact name from that build."
        type: string
        default: t3code-cn-windows-x64
      baseline_version:
        description: "Version the baseline installer reports, e.g. 0.1.7-cn.2."
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  update:
    name: Update ${{ inputs.baseline_version }} to ${{ inputs.new_version }}
    if: github.repository == 'deepfry666/t3code-cn'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # setup-vp's own cache restores a Linux-shaped store on Windows (see #7975).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install
        run: vp install

      - name: Download the baseline installer artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/baseline
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Download the new installer artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/new-artifact
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: List the new artifact
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File (Join-Path $env:RUNNER_TEMP "new-artifact") |
            Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Run the update acceptance
        shell: pwsh
        run: |
          $arguments = @(
            "scripts/windows-update-acceptance.ts"
            "--baseline-installer", (Join-Path $env:RUNNER_TEMP "baseline/T3-Code-${{ inputs.baseline_version }}-x64.exe")
            "--new-artifact-dir", (Join-Path $env:RUNNER_TEMP "new-artifact")
            "--baseline-version", "${{ inputs.baseline_version }}"
            "--new-version", "${{ inputs.new_version }}"
            "--artifacts-dir", (Join-Path $env:RUNNER_TEMP "windows-update-acceptance")
          )
          node @arguments
          if ($LASTEXITCODE -ne 0) { throw "Windows update acceptance failed with exit $LASTEXITCODE." }

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-update-acceptance
          path: ${{ runner.temp }}/windows-update-acceptance
          if-no-files-found: warn
          retention-days: 14
